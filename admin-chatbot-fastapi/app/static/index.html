<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directory — Admin Chat</title>
<style>
  :root{
    --ink:#12181f; --paper:#f6f4ee; --paper-2:#ffffff; --line:#dcd7ca;
    --accent:#3a6b5c; --text:#1c242e; --text-dim:#6b7178; --danger:#b3462c;
    --mono: "SFMono-Regular", Consolas, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--text); font-family:var(--sans);
        min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:1160px; padding:28px 20px 40px; }
  .login-shell{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
  .login-card{ width:100%; max-width:380px; background:var(--paper-2); border:1px solid var(--line);
               border-radius:4px; padding:36px 32px; }
  .login-mark{ font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--accent); margin-bottom:18px;}
  .login-card h1{ font-size:22px; margin:0 0 6px; font-weight:600;}
  .login-card p{ color:var(--text-dim); font-size:14px; margin:0 0 22px; line-height:1.5;}
  .field-label{ font-size:12px; color:var(--text-dim); margin-bottom:6px; display:block;}
  input[type="email"], input[type="text"]{ width:100%; padding:10px 12px; font-size:14px;
      border:1px solid var(--line); border-radius:3px; background:var(--paper); color:var(--text); font-family:var(--sans);}
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .login-btn{ margin-top:16px; width:100%; padding:11px; background:var(--accent); color:#fff; border:none;
      border-radius:3px; font-size:14px; font-weight:600; cursor:pointer;}
  .login-btn:hover{ background:#2f5749; }
  .login-error{ margin-top:12px; font-size:13px; color:var(--danger); min-height:16px;}
  .login-hint{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--text-dim); line-height:1.6;}
  .login-hint code{ font-family:var(--mono); background:var(--paper); padding:1px 5px; border-radius:2px;}
  .top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px;
        padding-bottom:16px; border-bottom:1px solid var(--line);}
  .top h1{ font-size:19px; margin:0; font-weight:600;}
  .top .who{ font-size:13px; color:var(--text-dim); }
  .top .who button{ margin-left:10px; background:none; border:1px solid var(--line); color:var(--text-dim);
        padding:4px 10px; border-radius:3px; cursor:pointer; font-size:12px;}
  .layout{ display:grid; grid-template-columns: 1fr .75fr .75fr; gap:18px; }
  @media (max-width:980px){ .layout{ grid-template-columns:1fr; } }
  .panel{ background:var(--paper-2); border:1px solid var(--line); border-radius:4px; overflow:hidden; display:flex; flex-direction:column;}
  .panel-head{ padding:12px 16px; border-bottom:1px solid var(--line); font-size:12px; color:var(--text-dim);}
  .chat-panel{ height:560px; }
  .chat-log{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:92%; padding:9px 12px; border-radius:8px; font-size:13.5px; line-height:1.5; }
  .msg.user{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:2px;}
  .msg.bot{ align-self:flex-start; background:var(--paper); border:1px solid var(--line); border-bottom-left-radius:2px;}
  .msg.bot.error{ border-color:var(--danger); color:var(--danger); }
  .chat-input-row{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  .chat-input-row input{ flex:1; }
  .send-btn{ background:var(--ink); color:#fff; border:none; padding:0 16px; border-radius:3px; cursor:pointer; font-size:13px;}
  .send-btn:hover{ background:var(--accent); }
  .examples{ padding:0 16px 12px; display:flex; flex-wrap:wrap; gap:6px; }
  .ex-chip{ font-family:var(--mono); font-size:11px; background:var(--paper); border:1px solid var(--line);
        padding:4px 8px; border-radius:3px; cursor:pointer; color:var(--text-dim);}
  .ex-chip:hover{ color:var(--text); border-color:var(--accent); }
  .side-panel{ height:560px; }
  .side-body{ flex:1; overflow-y:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th{ text-align:left; font-family:var(--mono); font-weight:500; font-size:10.5px; color:var(--text-dim);
      padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper-2);}
  td{ padding:8px 12px; border-bottom:1px solid var(--line); }
  td.email{ font-family:var(--mono); font-size:11.5px; }
  .count-tag{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .audit-row .status-ok{ color:var(--accent); font-family:var(--mono); font-size:11px;}
  .audit-row .status-fail{ color:var(--danger); font-family:var(--mono); font-size:11px;}
  .audit-row .who{ font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .audit-row .msg-text{ display:block; margin-top:2px; }
  .audit-row .result-text{ display:block; margin-top:2px; color:var(--text-dim); font-size:11px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function(){
  const API = "";
  let token = sessionStorage.getItem("admin_token");
  let adminEmail = sessionStorage.getItem("admin_email");
  let chatHistory = [];

  const app = document.getElementById("app");

  async function api(path, options={}, authed=true){
    const headers = {"Content-Type":"application/json"};
    if(authed && token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(API + path, { headers, ...options });
    if(res.status === 401){ logout(); throw new Error("Session expired"); }
    return res.json();
  }

  function logout(){
    token = null; adminEmail = null;
    sessionStorage.removeItem("admin_token");
    sessionStorage.removeItem("admin_email");
    chatHistory = [];
    render();
  }

  function render(){ token ? renderChat() : renderLogin(); }

  function renderLogin(errorMsg){
    app.innerHTML = `
      <div class="login-shell">
        <div class="login-card">
          <div class="login-mark">DIRECTORY · ADMIN ACCESS</div>
          <h1>Enter your email</h1>
          <p>If your email is already registered in the system, you'll be signed in automatically — no password needed.</p>
          <label class="field-label" for="loginEmail">Work email</label>
          <input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="off">
          <button class="login-btn" id="loginBtn">Continue</button>
          <div class="login-error">${errorMsg || ""}</div>
          <div class="login-hint">Try a seeded account, e.g. <code>samantha@company.com</code>.</div>
        </div>
      </div>`;
    const emailInput = document.getElementById("loginEmail");
    document.getElementById("loginBtn").addEventListener("click", attempt);
    emailInput.addEventListener("keydown", e => { if(e.key==="Enter") attempt(); });
    emailInput.focus();
    async function attempt(){
      const val = emailInput.value.trim();
      if(!val) return renderLogin("Enter an email address.");
      const data = await api("/api/login", {method:"POST", body: JSON.stringify({email: val})}, false);
      if(data.success){
        token = data.access_token; adminEmail = data.admin_email;
        sessionStorage.setItem("admin_token", token);
        sessionStorage.setItem("admin_email", adminEmail);
        render();
      } else {
        renderLogin(data.message);
      }
    }
  }

  function renderChat(){
    app.innerHTML = `
      <div class="top">
        <h1>Directory — Admin Chat</h1>
        <div class="who">Signed in as <strong>${adminEmail}</strong><button id="logoutBtn">Sign out</button></div>
      </div>
      <div class="layout">
        <div class="panel chat-panel">
          <div class="panel-head">Chat commands</div>
          <div class="chat-log" id="chatLog"></div>
          <div class="examples">
            <div class="ex-chip" data-cmd='can you add the user "john.smith@xyz.com" with phone number "+92332"'>+ add user</div>
            <div class="ex-chip" data-cmd='can you remove the user "john.smith@xyz.com"'>+ remove user</div>
            <div class="ex-chip" data-cmd="can you update samanthas city to Cordoba">+ update field</div>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder='e.g. add the user "jane@xyz.com" with phone number "+123"'>
            <button class="send-btn" id="sendBtn">Send</button>
          </div>
        </div>
        <div class="panel side-panel">
          <div class="panel-head">User directory <span class="count-tag" id="countTag"></span></div>
          <div class="side-body"><table>
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>City</th></tr></thead>
            <tbody id="dirBody"></tbody>
          </table></div>
        </div>
        <div class="panel side-panel">
          <div class="panel-head">Audit log</div>
          <div class="side-body" id="auditBody"></div>
        </div>
      </div>`;
    document.getElementById("logoutBtn").addEventListener("click", logout);
    const input = document.getElementById("chatInput");
    const send = () => { const t = input.value.trim(); if(!t) return; input.value=""; handleCommand(t); };
    document.getElementById("sendBtn").addEventListener("click", send);
    input.addEventListener("keydown", e => { if(e.key==="Enter") send(); });
    document.querySelectorAll(".ex-chip").forEach(chip => {
      chip.addEventListener("click", () => { input.value = chip.getAttribute("data-cmd"); input.focus(); });
    });
    if(chatHistory.length === 0){
      pushBot("Signed in. Tell me what you'd like to do: add, remove, or update a user's details.");
    }
    refreshDirectory();
    refreshAuditLog();
    renderChatLog();
  }

  async function refreshDirectory(){
    let users;
    try{ users = await api("/api/users"); } catch(e){ return; }
    const body = document.getElementById("dirBody");
    const count = document.getElementById("countTag");
    if(!body) return;
    count.textContent = `${users.length} record${users.length===1?"":"s"}`;
    body.innerHTML = users.length ? users.map(u => `
      <tr><td>${esc(u.name)}</td><td class="email">${esc(u.email)}</td><td>${esc(u.phone)||"—"}</td><td>${esc(u.city)||"—"}</td></tr>
    `).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:24px;">No users yet.</td></tr>`;
  }

  async function refreshAuditLog(){
    let entries;
    try{ entries = await api("/api/audit-log"); } catch(e){ return; }
    const body = document.getElementById("auditBody");
    if(!body) return;
    body.innerHTML = entries.length ? entries.map(e => `
      <div class="audit-row" style="padding:8px 12px; border-bottom:1px solid var(--line);">
        <span class="who">${esc(e.actor_email)}</span>
        <span class="${e.success ? 'status-ok' : 'status-fail'}">${e.success ? 'OK' : 'FAIL'}</span>
        <span class="msg-text">${esc(e.message)}</span>
        <span class="result-text">${esc(e.result)}</span>
      </div>
    `).join("") : `<div style="padding:24px;text-align:center;color:var(--text-dim);">No activity yet.</div>`;
  }

  function renderChatLog(){
    const log = document.getElementById("chatLog");
    if(!log) return;
    log.innerHTML = chatHistory.map(m => `<div class="msg ${m.role}${m.isError?" error":""}">${m.text}</div>`).join("");
    log.scrollTop = log.scrollHeight;
  }
  function pushUser(t){ chatHistory.push({role:"user", text: esc(t)}); renderChatLog(); }
  function pushBot(t, isErr){ chatHistory.push({role:"bot", text:t, isError:!!isErr}); renderChatLog(); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  async function handleCommand(text){
    pushUser(text);
    let data;
    try{ data = await api("/api/chat", {method:"POST", body: JSON.stringify({message:text})}); }
    catch(e){ pushBot("Session expired — please sign in again.", true); return; }
    pushBot(esc(data.reply), !data.success);
    refreshDirectory();
    refreshAuditLog();
  }

  render();
})();
</script>
</body>
</html>
